<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FPV Simulator</title>
<style>
  :root { --ac:#ff6a1a; --fg:#e8ecf1; --bg:rgba(10,14,20,.78); }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--fg)}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0f14;z-index:50;gap:14px}
  #loading .bar{width:320px;height:6px;background:#222;border-radius:3px;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .15s}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;text-shadow:0 0 3px #000,0 0 6px #000}
  #hud .tl{position:absolute;left:18px;top:14px;line-height:1.5;font-size:14px}
  #hud .tr{position:absolute;right:18px;top:14px;text-align:right;font-size:14px;line-height:1.5}
  #hud .bl{position:absolute;left:18px;bottom:16px;font-size:12px;opacity:.85;line-height:1.5}
  #hud .bc{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);text-align:center}
  #hud .cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:1px solid rgba(255,255,255,.35);border-radius:50%}
  #status{font-size:28px;font-weight:700;letter-spacing:.1em;color:#ff4040}
  #sticks{position:absolute;bottom:16px;right:18px;display:flex;gap:12px}
  .stick{width:84px;height:84px;border:1px solid rgba(255,255,255,.4);position:relative;background:rgba(0,0,0,.25);border-radius:6px}
  .stick i{position:absolute;width:10px;height:10px;margin:-5px;background:var(--ac);border-radius:50%;left:50%;top:50%}
  #thr{position:absolute;left:50%;top:70px}
  #panel{position:fixed;right:0;top:0;bottom:0;width:360px;background:var(--bg);backdrop-filter:blur(6px);z-index:30;padding:14px 16px;overflow:auto;display:none;font-size:12px;border-left:1px solid #333}
  #panel h3{margin:14px 0 6px;font-size:12px;letter-spacing:.12em;color:var(--ac);text-transform:uppercase}
  #panel label{display:grid;grid-template-columns:130px 1fr 44px;gap:6px;align-items:center;margin:4px 0}
  #panel input[type=range]{width:100%}
  #panel button{background:#1b2430;color:var(--fg);border:1px solid #3a4656;border-radius:4px;padding:4px 8px;cursor:pointer;font:inherit}
  #panel button:hover{border-color:var(--ac)}
  #panel .row{display:flex;align-items:center;gap:6px;margin:4px 0}
  #panel .row span.n{flex:1}
  #panel .ax{width:70px;text-align:right;opacity:.8}
  kbd{background:#222;border:1px solid #444;border-radius:3px;padding:0 4px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading"><div id="ltxt">Loading…</div><div class="bar"><i id="lbar"></i></div></div>
<div id="hud">
  <div class="cross"></div>
  <div class="tl"><div id="spd"></div><div id="alt"></div><div id="tm"></div></div>
  <div class="tr"><div id="cam"></div><div id="pad"></div><div id="fps"></div></div>
  <div class="bc"><div id="status"></div></div>
  <div class="bl">
    <div><kbd>Tab</kbd> settings &nbsp; <kbd>C</kbd> camera &nbsp; <kbd>R</kbd> reset &nbsp; <kbd>Space</kbd> arm/disarm &nbsp; <kbd>H</kbd> hide HUD</div>
    <div>Keyboard: <kbd>W</kbd><kbd>S</kbd> throttle · <kbd>A</kbd><kbd>D</kbd> yaw · <kbd>↑</kbd><kbd>↓</kbd> pitch · <kbd>←</kbd><kbd>→</kbd> roll</div>
  </div>
  <div id="sticks"><div class="stick" id="sL"><i></i></div><div class="stick" id="sR"><i></i></div></div>
</div>
<div id="panel"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
