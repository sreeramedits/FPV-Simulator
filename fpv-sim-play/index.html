<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FPV Simulator</title>
<style>:root{--ac:#ff6a1a;--fg:#e8ecf1;--bg:#0a0e14c7}html,body{height:100%;color:var(--fg);background:#000;margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}canvas#gl{width:100%;height:100%;display:block;position:fixed;inset:0}#loading{z-index:50;background:#0b0f14;flex-direction:column;justify-content:center;align-items:center;gap:14px;display:flex;position:fixed;inset:0}#loading .bar{background:#222;border-radius:3px;width:320px;height:6px;overflow:hidden}#loading .bar i{background:var(--ac);width:0;height:100%;transition:width .15s;display:block}#hud{pointer-events:none;z-index:10;text-shadow:0 0 3px #000,0 0 6px #000;position:fixed;inset:0}#hud .tl{font-size:14px;line-height:1.5;position:absolute;top:14px;left:18px}#hud .tr{text-align:right;font-size:14px;line-height:1.5;position:absolute;top:14px;right:18px}#hud .bl{opacity:.85;font-size:12px;line-height:1.5;position:absolute;bottom:16px;left:18px}#hud .bc{text-align:center;position:absolute;bottom:22px;left:50%;transform:translate(-50%)}#hud .cross{border:1px solid #ffffff59;border-radius:50%;width:14px;height:14px;margin:-7px;position:absolute;top:50%;left:50%}#status{letter-spacing:.1em;color:#ff4040;font-size:28px;font-weight:700}#sticks{gap:12px;display:flex;position:absolute;bottom:16px;right:18px}.stick{background:#00000040;border:1px solid #fff6;border-radius:6px;width:84px;height:84px;position:relative}.stick i{background:var(--ac);border-radius:50%;width:10px;height:10px;margin:-5px;position:absolute;top:50%;left:50%}#thr{position:absolute;top:70px;left:50%}#panel{background:var(--bg);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:30;border-left:1px solid #333;width:360px;padding:14px 16px;font-size:12px;display:none;position:fixed;top:0;bottom:0;right:0;overflow:auto}#panel h3{letter-spacing:.12em;color:var(--ac);text-transform:uppercase;margin:14px 0 6px;font-size:12px}#panel label{grid-template-columns:130px 1fr 44px;align-items:center;gap:6px;margin:4px 0;display:grid}#panel input[type=range]{width:100%}#panel button{color:var(--fg);cursor:pointer;font:inherit;background:#1b2430;border:1px solid #3a4656;border-radius:4px;padding:4px 8px}#panel button:hover{border-color:var(--ac)}#panel .row{align-items:center;gap:6px;margin:4px 0;display:flex}#panel .row span.n{flex:1}#panel .ax{text-align:right;opacity:.8;width:70px}kbd{background:#222;border:1px solid #444;border-radius:3px;padding:0 4px}</style>
  <script type="module" crossorigin src="./assets/index-TnCgq6HC.js"></script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading"><div id="ltxt">Loading…</div><div class="bar"><i id="lbar"></i></div></div>
<div id="hud">
  <div class="cross"></div>
  <div class="tl"><div id="spd"></div><div id="alt"></div><div id="tm"></div></div>
  <div class="tr"><div id="cam"></div><div id="pad"></div><div id="fps"></div></div>
  <div class="bc"><div id="status"></div></div>
  <div class="bl">
    <div><kbd>Tab</kbd> settings &nbsp; <kbd>C</kbd> camera &nbsp; <kbd>R</kbd> reset &nbsp; <kbd>Space</kbd> arm/disarm &nbsp; <kbd>H</kbd> hide HUD</div>
    <div>Keyboard: <kbd>W</kbd><kbd>S</kbd> throttle · <kbd>A</kbd><kbd>D</kbd> yaw · <kbd>↑</kbd><kbd>↓</kbd> pitch · <kbd>←</kbd><kbd>→</kbd> roll</div>
  </div>
  <div id="sticks"><div class="stick" id="sL"><i></i></div><div class="stick" id="sR"><i></i></div></div>
</div>
<div id="panel"></div>
</body>
</html>
